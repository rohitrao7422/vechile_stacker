<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login - Vehicle Tracker</title>
    <style>
        /* Dark background */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* Login Box */
        .login-box {
            background-color: #16213e;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            border: 1px solid #0f3460;
        }

        /* Title */
        h2 {
            color: #00d4ff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 22px;
        }

        /* Input Fields */
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0f3460;
            border: 1px solid #00d4ff;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        /* Login Button */
        button {
            width: 100%;
            padding: 12px;
            background-color: #00d4ff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #00b8d9;
        }

        /* Error Message */
        .error {
            color: #d63031;
            text-align: center;
            margin-bottom: 15px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>🔐 Vehicle Tracker</h2>

        <!-- Error message — galat password pe dikhega -->
        {% if error %}
        <div class="error">⚠️ {{ error }}</div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required />
            <input type="password" name="password" placeholder="Password" required />
            <button type="submit">Login</button>
        </form>
    </div>
</body>

</html>
