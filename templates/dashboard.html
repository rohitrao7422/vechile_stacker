<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Tracker Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #1a1a2e; color: white; }

        .header {
            background-color: #16213e;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #0f3460;
        }
        .header h1 { font-size: 20px; color: #00d4ff; }

        .status-badge { padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .status-safe { background-color: #00b894; color: white; }
        .status-alert { background-color: #d63031; color: white; }
        .status-warning { background-color: #f39c12; color: white; }

        .info-bar {
            display: flex;
            gap: 15px;
            padding: 15px 25px;
            background-color: #16213e;
            flex-wrap: wrap;
        }
        .card { background-color: #0f3460; padding: 12px 20px; border-radius: 10px; min-width: 150px; }
        .card-label { font-size: 11px; color: #a0a0a0; margin-bottom: 5px; }
        .card-value { font-size: 18px; font-weight: bold; color: #00d4ff; }

        .signal-banner {
            display: none;
            background-color: #f39c12;
            color: white;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        #map { height: calc(100vh - 200px); width: 100%; }

        .bottom-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(22, 33, 62, 0.95);
            padding: 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #0f3460;
        }
        .last-update { font-size: 12px; color: #a0a0a0; }
        .maps-btn {
            background-color: #00d4ff;
            color: #1a1a2e;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
        }

        .signal-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .signal-on { background-color: #00b894; }
        .signal-off { background-color: #d63031; }
    </style>
</head>
<body>

<div class="header">
    <h1>🚗 Secure Vehicle Tracker</h1>
    <span class="status-badge status-safe" id="statusBadge">✅ Safe</span>
</div>

<div class="info-bar">
    <div class="card">
        <div class="card-label">SPEED</div>
        <div class="card-value" id="speedValue">0 km/h</div>
    </div>
    <div class="card">
        <div class="card-label">LATITUDE</div>
        <div class="card-value" id="latValue">--</div>
    </div>
    <div class="card">
        <div class="card-label">LONGITUDE</div>
        <div class="card-value" id="lngValue">--</div>
    </div>
    <div class="card">
        <div class="card-label">STATUS</div>
        <div class="card-value" id="statusValue">--</div>
    </div>
    <div class="card">
        <div class="card-label">GPS SIGNAL</div>
        <div class="card-value">
            <span class="signal-dot signal-off" id="signalDot"></span>
            <span id="signalText">Waiting...</span>
        </div>
    </div>
</div>

<div class="signal-banner" id="signalBanner">
    ⚠️ GPS Signal Lost — Showing Last Known Location
</div>

<div id="map"></div>

<div class="bottom-bar">
    <div class="last-update">Last Update: <span id="lastUpdate">--</span></div>
    <a class="maps-btn" id="mapsLink" href="#" target="_blank" rel="noopener noreferrer">
        📍 Open in Google Maps
    </a>
</div>

<script>
    // Map initialize — world view se shuru
    var map = L.map('map').setView([20, 0], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'OpenStreetMap'
    }).addTo(map);

    var marker = null;
    var lastLat = null;
    var lastLng = null;
    var firstFix = false;

    function fetchLocation() {
        fetch('/location')
        .then(response => response.json())
        .then(data => {
            var signalLost = data.status === 'GPS Signal Lost' ||
                             (data.lat === 0.0 && data.lng === 0.0) ||
                             data.timestamp === '';

            var banner = document.getElementById('signalBanner');
            var signalDot = document.getElementById('signalDot');
            var signalText = document.getElementById('signalText');

            if (signalLost) {
                // Signal nahi hai
                banner.style.display = 'block';
                signalDot.className = 'signal-dot signal-off';
                signalText.textContent = 'Lost';

                // Last location pe marker rakho
                if (lastLat && marker) {
                    marker.bindPopup("⚠️ Last Known Location").openPopup();
                }

            } else {
                // Signal hai
                banner.style.display = 'none';
                signalDot.className = 'signal-dot signal-on';
                signalText.textContent = 'Active';

                lastLat = data.lat;
                lastLng = data.lng;

                // Marker banao ya move karo
                if (marker === null) {
                    marker = L.marker([data.lat, data.lng]).addTo(map);
                    marker.bindPopup("🚗 Vehicle Location").openPopup();
                } else {
                    marker.setLatLng([data.lat, data.lng]);
                }

                // Pehli baar fix mile toh zoom karo
                if (!firstFix) {
                    map.setView([data.lat, data.lng], 15);
                    firstFix = true;
                } else {
                    map.setView([data.lat, data.lng]);
                }

                // Google Maps link update karo
                document.getElementById('mapsLink').href =
                    "https://www.google.com/maps?q=" + data.lat + "," + data.lng;
            }

            // Cards update karo
            document.getElementById('speedValue').textContent = data.speed + ' km/h';
            document.getElementById('latValue').textContent =
                (data.lat && data.lat !== 0) ? data.lat.toFixed(4) : '--';
            document.getElementById('lngValue').textContent =
                (data.lng && data.lng !== 0) ? data.lng.toFixed(4) : '--';
            document.getElementById('statusValue').textContent = data.status;
            document.getElementById('lastUpdate').textContent = data.timestamp || '--';

            // Status badge
            var badge = document.getElementById('statusBadge');
            if (data.status === 'Safe') {
                badge.className = 'status-badge status-safe';
                badge.textContent = '✅ Safe';
            } else if (data.status === 'GPS Signal Lost') {
                badge.className = 'status-badge status-warning';
                badge.textContent = '📡 GPS Signal Lost';
            } else if (data.status === 'SPOOFING DETECTED') {
                badge.className = 'status-badge status-alert';
                badge.textContent = '🚨 SPOOFING DETECTED';
            } else if (data.status === 'TAMPER DETECTED') {
                badge.className = 'status-badge status-alert';
                badge.textContent = '⚠️ TAMPER DETECTED';
            } else if (data.status === 'ACCIDENT DETECTED') {
                badge.className = 'status-badge status-alert';
                badge.textContent = '🚑 ACCIDENT DETECTED';
            }
        })
        .catch(err => {
            console.error('Server error:', err);
            document.getElementById('signalBanner').style.display = 'block';
            document.getElementById('signalDot').className = 'signal-dot signal-off';
            document.getElementById('signalText').textContent = 'Lost';
        });
    }

    fetchLocation();
    setInterval(fetchLocation, 5000);
</script>

</body>
</html>
